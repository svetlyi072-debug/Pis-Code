[package]
name = "pis_code"
version = "0.1.0"
edition = "2021"
description = "Pis Code — a terminal code editor tuned for C#, with VS Code-style smart braces"

[[bin]]
name = "PC"
path = "src/main.rs"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
